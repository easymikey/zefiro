tag_prefix = "v"
branch_whitelist = ["main"]
skip_ci = "[skip ci]"
skip_untracked = true

[changelog]
path = "CHANGELOG.md"
authors = [{ signature = "Mikhail Avdeev", username = "easymikey" }]

# hooks delegate to just, one recipe each
[git_hooks.pre-commit]
script = """#!/bin/sh
exec just pre-commit
"""

[git_hooks.commit-msg]
script = """#!/bin/sh
exec cog verify --file "$1"
"""

[git_hooks.pre-push]
script = """#!/bin/sh
exec just pre-push
"""
