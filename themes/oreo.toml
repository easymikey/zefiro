# Oreo — black and white, high contrast.
# Cookies-and-cream monochrome with a warm cream accent for selection.
# The cookie is the background, the cream is every foreground: `foreground`
# is the primary text, `muted_foreground` the dim text and the frame, and the
# green/yellow/red spectrum is a cream-to-grey ramp rather than three hues,
# because a monochrome theme has no hue to spend on them.
name = "oreo"

[colors]
background = "#0b0b0b"
foreground = "#f5f1e8"
muted_foreground = "#8f8a80"
accent = "#f3e9d2"
green = "#f5f1e8"
yellow = "#c9c2b4"
red = "#8f8a80"
