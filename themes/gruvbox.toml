# Gruvbox Dark — morhetz's retro groove, from the canonical palette
# (https://github.com/morhetz/gruvbox).
# Warm orange on soft charcoal, earth-toned and low-glare.
#
# Every value below is a named Gruvbox colour, not an approximation of one:
# `background` is `bg0` (#282828), the ground the scheme is designed around; `muted_foreground` is
# `gray` (#928374), which is what Gruvbox itself uses for comments and rules,
# so frames and dim lines stay quiet; `foreground` is `fg1` (#ebdbb2), the body
# text. `accent` is bright orange, `green`/`yellow`/`red` are the *bright*
# variants — those are the ones meant to be read against `bg0`.
#
# `window_background` is `bg0_s` (#32302f), Gruvbox's own "soft" ground, rather than a
# blend of `background` toward `muted_foreground`: the scheme already names the shade a panel sits
# at, and tinting `bg0` with gray drifts off the palette.
name = "gruvbox"

[colors]
background = "#282828"
muted_foreground = "#928374"
foreground = "#ebdbb2"
accent = "#fe8019"
green = "#b8bb26"
yellow = "#fabd2f"
red = "#fb4934"
window_background = "#32302f"
