include = ["**/*.toml"]
exclude = ["**/target/**"]

[formatting]
align_entries = false
array_auto_collapse = false
array_auto_expand = true
column_width = 88
indent_string = "  "
reorder_keys = false
reorder_arrays = false
trailing_newline = true

[[rule]]
include = ["**/Cargo.toml"]
keys = [
  "dependencies",
  "dev-dependencies",
  "build-dependencies",
  "workspace.dependencies",
]

[rule.formatting]
reorder_keys = false
