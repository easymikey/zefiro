name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli

      - name: fmt
        run: cargo fmt --all --check

      - name: taplo
        run: git ls-files '*.toml' | xargs taplo fmt --check

      - name: typos
        run: typos

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: test
        run: cargo-nextest nextest run --workspace --profile ci
        env:
          INSTA_UPDATE: "no"

  size:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release -p zefiro --locked

      - name: record size
        run: |
          BYTES=$(stat -f %z target/release/zefiro)
          MIB=$(awk "BEGIN { printf \"%.2f\", $BYTES / 1048576 }")
          printf 'release binary: **%s bytes** (%s MiB)\n' "$BYTES" "$MIB" >> "$GITHUB_STEP_SUMMARY"
